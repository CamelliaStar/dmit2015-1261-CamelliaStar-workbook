<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html">
<f:view>
    <h:head></h:head>
    <h:body>
        <h:head>
            DMIT2015 Hello Faces
        </h:head>
        <h:body>
            <h:messages />
            <h:form>
                <h:outputText value="#{helloBean.message}" />
                <h:outputLabel for="userInput" value="Your Name" />
                <h:inputText id="userInput" value="#{helloBean.userInput}" />
                <h:commandButton value="Submit" action="#{helloBean.onSubmit()}" immediate="true"/>
                <h:commandButton value="To JSP World" action="#{helloBean.onToHelloJsp()}" immediate="true"/>
                <h:commandButton value="To Hello Servlet" outcome="/hello-servlet" immediate="true"/>
            </h:form>
        </h:body>
    </h:body>
</f:view>
</html>
